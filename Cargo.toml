[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Lucas Stanford"]
repository = "https://github.com/lucas-stanford/fm"
homepage = "https://github.com/lucas-stanford/fm"

[workspace.dependencies]
fm-render = { path = "crates/fm-render" }
fm-model = { path = "crates/fm-model" }
fm-spec = { path = "crates/fm-spec" }
fm-state = { path = "crates/fm-state" }
fm-agents = { path = "crates/fm-agents" }
fm-run = { path = "crates/fm-run" }
fm-clock = { path = "crates/fm-clock" }
fm-tui = { path = "crates/fm-tui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
